<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>شجرتنا — لوحة التحكم</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Reem+Kufi:wght@500;600;700&display=swap">
<style>
:root{--bg:#F6F1E7;--panel:#FFFDF8;--soft:#F1EADA;--sand:#EDE4CF;--line:#E6DCC3;--line2:#DCCFAE;--text:#2B2A24;--muted:#6B6557;--faint:#736D5F;--olive:#4F5D2F;--olive2:#3E4A24;--olivebg:#E7EBDA;--gold:#8A6A26;--goldbg:#F5EBD3;--red:#A3412C;--redbg:#F6E1DA;--blue:#2F5D7A;--bluebg:#DFEAF1}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:'IBM Plex Sans Arabic',system-ui,sans-serif;font-size:15px}
button,input,select,textarea{font:inherit;color:inherit}
.kufi{font-family:'Reem Kufi',serif}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

/* shell */
.top{position:sticky;top:0;z-index:20;height:64px;background:var(--panel);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:0 20px}
.brand{display:flex;align-items:center;gap:10px;font-family:'Reem Kufi',serif;font-size:20px;font-weight:600;white-space:nowrap}
.brand small{font-family:'IBM Plex Sans Arabic';font-size:13px;color:var(--muted);font-weight:500;padding:3px 10px;border-radius:999px;background:var(--soft)}
.role{margin-inline-start:auto;display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.role select{min-height:40px;border:1px solid var(--line2);border-radius:10px;background:var(--bg);padding:0 10px;font-size:14px;color:var(--text);max-width:230px}
.me{display:flex;align-items:center;gap:10px}
.me .av{width:38px;height:38px}
.shell{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:calc(100vh - 64px)}
.side{background:var(--panel);border-inline-end:1px solid var(--line);padding:18px 12px;display:flex;flex-direction:column;gap:4px;position:sticky;top:64px;height:calc(100vh - 64px)}
.nav{display:flex;align-items:center;gap:12px;min-height:44px;padding:0 12px;border:0;border-radius:11px;background:transparent;cursor:pointer;color:var(--muted);font-weight:500;text-align:right;width:100%}
.nav:hover{background:var(--soft);color:var(--text)}
.nav.on{background:var(--olivebg);color:var(--olive2);font-weight:600}
.nav .c{margin-inline-start:auto;min-width:24px;height:22px;padding:0 7px;border-radius:999px;background:var(--gold);color:#fff;font-size:12px;font-weight:600;display:flex;align-items:center;justify-content:center}
.nav .c.g{background:var(--sand);color:var(--muted)}
.sidefoot{margin-top:auto;padding:14px;border-radius:14px;background:var(--soft);font-size:13px;color:var(--muted);line-height:1.7}
.sidefoot b{color:var(--text);display:block;margin-bottom:2px}
main{padding:26px 28px 60px;min-width:0}
.ph{display:flex;flex-wrap:wrap;align-items:flex-end;gap:14px;margin-bottom:22px}
.ph h1{margin:0;font-family:'Reem Kufi',serif;font-weight:600;font-size:30px;line-height:1.2}
.ph p{margin:4px 0 0;color:var(--muted)}
.ph .sp{margin-inline-start:auto;display:flex;gap:10px;flex-wrap:wrap}
.scopebar{display:flex;align-items:center;gap:10px;padding:12px 16px;border-radius:14px;background:var(--goldbg);color:#5E4716;font-size:14px;margin-bottom:20px;border:1px solid #E8D7AE}

/* atoms */
.btn{min-height:42px;padding:0 16px;border-radius:11px;border:1px solid var(--line2);background:var(--panel);cursor:pointer;font-weight:500;display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.btn:hover{border-color:var(--olive)}
.btn.p{background:var(--olive);border-color:var(--olive);color:#fff;font-weight:600}
.btn.p:hover{background:var(--olive2)}
.btn.sm{min-height:34px;padding:0 12px;font-size:13px;border-radius:9px}
.btn.ok{background:var(--olivebg);border-color:#C9D3B0;color:var(--olive2)}
.btn.no{background:transparent;color:var(--red);border-color:#E4C3B8}
.btn:disabled{opacity:.45;cursor:not-allowed}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px}
.card h2{margin:0;font-size:16px;font-weight:600}
.ch{display:flex;align-items:center;gap:10px;padding:16px 18px;border-bottom:1px solid var(--line)}
.ch a,.lnk{margin-inline-start:auto;font-size:13px;color:var(--olive);cursor:pointer;background:none;border:0;font-weight:500}
.av{width:36px;height:36px;flex:none;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-family:'Reem Kufi',serif;font-weight:600;color:#2B2A24;font-size:15px}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none}
.badge{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:999px;font-size:12.5px;font-weight:500;white-space:nowrap}
.b-ok{background:var(--olivebg);color:var(--olive2)}
.b-gold{background:var(--goldbg);color:#6B4F14}
.b-red{background:var(--redbg);color:var(--red)}
.b-blue{background:var(--bluebg);color:var(--blue)}
.b-mute{background:var(--soft);color:var(--muted)}
.muted{color:var(--muted)}
.sub{font-size:12.5px;color:var(--faint)}

/* kpis */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-bottom:20px}
.kpi{padding:18px;display:flex;flex-direction:column;gap:6px}
.kpi .l{font-size:13.5px;color:var(--muted);display:flex;align-items:center;gap:8px}
.kpi .v{font-family:'Reem Kufi',serif;font-size:34px;font-weight:600;line-height:1.1}
.kpi .d{font-size:12.5px;color:var(--olive)}
.grid2{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:18px}
@media (max-width:1100px){.grid2{grid-template-columns:minmax(0,1fr)}}

/* bars */
.bars{padding:10px 18px 18px;display:flex;flex-direction:column;gap:14px}
.bar{display:grid;grid-template-columns:120px minmax(0,1fr) 46px;align-items:center;gap:12px;font-size:14px}
.bar .t{height:10px;border-radius:6px;background:var(--soft);overflow:hidden}
.bar .t i{display:block;height:100%;border-radius:6px}
.bar .n{text-align:left;font-weight:600}
.bar .s{grid-column:2 / 4;font-size:12px;color:var(--faint);margin-top:-8px}

/* lists */
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:12px;padding:13px 18px;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.li .tx{flex:1;min-width:0;line-height:1.55}
.li .tx b{font-weight:600}
.ic{width:36px;height:36px;flex:none;border-radius:11px;display:flex;align-items:center;justify-content:center}
.empty{padding:34px 18px;text-align:center;color:var(--muted)}

/* table */
.tools{display:flex;flex-wrap:wrap;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line);align-items:center}
.search{flex:1 1 240px;display:flex;align-items:center;gap:8px;min-height:42px;padding:0 12px;border:1px solid var(--line2);border-radius:11px;background:var(--bg)}
.search input{flex:1;border:0;background:transparent;outline:none;min-width:0}
.sel{min-height:42px;padding:0 10px;border:1px solid var(--line2);border-radius:11px;background:var(--bg)}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:760px}
th{font-size:12.5px;color:var(--faint);font-weight:500;text-align:right;padding:11px 16px;border-bottom:1px solid var(--line);background:#FBF8F0;white-space:nowrap}
td{padding:11px 16px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:hover td{background:#FBF8F0}
.who{display:flex;align-items:center;gap:12px}
.who b{display:block;font-weight:600}
.new td{animation:flash 2.4s ease}
@keyframes flash{0%,40%{background:var(--olivebg)}100%{background:transparent}}
.more{padding:14px;text-align:center}

/* supervisors */
.sups{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px}
.sup{padding:18px;display:flex;flex-direction:column;gap:14px}
.sup .hd{display:flex;gap:12px;align-items:center}
.sup .hd .av{width:46px;height:46px;font-size:19px}
.sup .hd b{font-size:16px;display:block}
.scope{display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:12px;background:var(--soft);font-size:13.5px}
.perm{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:14px;min-height:36px}
.perm small{display:block;font-size:12px;color:var(--faint)}
.sw{position:relative;width:44px;height:26px;flex:none;border-radius:13px;border:0;background:#D8CDB2;cursor:pointer;transition:.2s}
.sw::after{content:"";position:absolute;top:3px;right:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:.2s}
.sw[aria-checked="true"]{background:var(--olive)}
.sw[aria-checked="true"]::after{right:21px}
.sw:disabled{opacity:.5;cursor:not-allowed}
.sup .ft{display:flex;align-items:center;gap:8px;border-top:1px solid var(--line);padding-top:12px;font-size:12.5px;color:var(--faint)}

/* tabs */
.tabs{display:flex;gap:4px;padding:4px;border-radius:12px;background:var(--soft);width:max-content;max-width:100%;overflow-x:auto}
.tab{min-height:36px;padding:0 14px;border:0;border-radius:9px;background:transparent;cursor:pointer;color:var(--muted);font-weight:500;white-space:nowrap}
.tab.on{background:var(--panel);color:var(--text);box-shadow:0 1px 2px rgba(43,42,36,.08)}

/* drawer & modal */
.scrim{position:fixed;inset:0;background:rgba(43,42,36,.32);z-index:40;opacity:0;pointer-events:none;transition:.2s}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;bottom:0;left:0;width:min(480px,100%);background:var(--panel);z-index:41;transform:translateX(-105%);transition:transform .28s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;box-shadow:20px 0 60px rgba(43,42,36,.18)}
.drawer.on{transform:none}
.dh{padding:20px 22px;border-bottom:1px solid var(--line);display:flex;align-items:flex-start;gap:12px}
.dh h3{margin:0;font-family:'Reem Kufi',serif;font-weight:600;font-size:22px}
.x{margin-inline-start:auto;width:40px;height:40px;border-radius:10px;border:1px solid var(--line2);background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center}
.db{padding:20px 22px;overflow-y:auto;flex:1;display:flex;flex-direction:column;gap:18px}
.df{padding:16px 22px;border-top:1px solid var(--line);display:flex;gap:10px;align-items:center}
.f{display:flex;flex-direction:column;gap:7px}
.f label,.f .lb{font-size:13.5px;font-weight:600}
.f .h{font-size:12.5px;color:var(--faint)}
.inp{min-height:44px;padding:0 12px;border:1px solid var(--line2);border-radius:11px;background:var(--bg);outline:none;width:100%}
.inp:focus{border-color:var(--olive);background:#fff}
textarea.inp{min-height:80px;padding:10px 12px;resize:vertical}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.segm{display:flex;padding:4px;border-radius:11px;background:var(--soft)}
.segm button{flex:1;min-height:36px;border:0;border-radius:8px;background:transparent;cursor:pointer;color:var(--muted);font-weight:500}
.segm button.on{background:var(--panel);color:var(--text);box-shadow:0 1px 2px rgba(43,42,36,.1)}
.pick{position:relative}
.opts{position:absolute;top:calc(100% + 4px);right:0;left:0;background:var(--panel);border:1px solid var(--line2);border-radius:12px;box-shadow:0 14px 34px rgba(43,42,36,.14);max-height:260px;overflow-y:auto;z-index:3;display:none;padding:6px}
.opts.on{display:block}
.opt{width:100%;display:flex;align-items:center;gap:10px;padding:8px 10px;border:0;border-radius:9px;background:transparent;cursor:pointer;text-align:right}
.opt:hover{background:var(--soft)}
.opt .av{width:30px;height:30px;font-size:13px}
.opt span{display:flex;flex-direction:column;line-height:1.4}
.opt small{color:var(--faint);font-size:12px}
.chosen{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;border:1px solid #C9D3B0;background:var(--olivebg)}
.chosen>span:not(.av){flex:1;line-height:1.5;font-size:14px}
.chosen small{display:block;color:var(--muted);font-size:12px}
.preview{padding:14px;border-radius:14px;background:var(--soft);font-size:14px;line-height:1.8}
.preview b{color:var(--olive2)}
.note{display:flex;gap:10px;padding:12px 14px;border-radius:12px;font-size:13.5px;line-height:1.6}
.err{color:var(--red);font-size:12.5px;display:none}
.err.on{display:block}
.checks{display:flex;flex-direction:column;gap:6px}

.spill{display:inline-flex;align-items:center;gap:8px;min-height:38px;padding:0 14px;border-radius:999px;border:1px solid;cursor:pointer;font-size:13px;font-weight:600;white-space:nowrap}
.spill i{width:8px;height:8px;border-radius:50%;background:currentColor;flex:none}
.spill.on{background:#E7EBDA;border-color:#C9D3B0;color:#3E4A24}
.spill.on i{animation:pulse 2s infinite}
.spill.off{background:#F6E1DA;border-color:#E4C3B8;color:#A3412C}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(79,93,47,.5)}70%{box-shadow:0 0 0 7px rgba(79,93,47,0)}100%{box-shadow:0 0 0 0 rgba(79,93,47,0)}}
.hero-st{padding:22px;display:flex;flex-wrap:wrap;align-items:center;gap:18px}
.ic.big{width:58px;height:58px;border-radius:16px}
.alert{display:flex;flex-wrap:wrap;align-items:center;gap:12px;padding:14px 16px;border-radius:14px;background:#F6E1DA;border:1px solid #E4C3B8;color:#7A2E1E;margin-bottom:20px;font-size:14px}
.alert .btn{margin-inline-start:auto}
.pvbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line)}
.pv-wrap{padding:22px;background:#EDE6D4;border-radius:0 0 18px 18px;display:flex;justify-content:center;overflow:hidden}
.pv-desk{width:100%;max-width:1100px;border-radius:12px;overflow:hidden;background:#fff;box-shadow:0 18px 40px rgba(43,42,36,.16);border:1px solid #DCCFAE}
.pv-desk .chrome{height:34px;background:#F1EADA;border-bottom:1px solid #DCCFAE;display:flex;align-items:center;gap:6px;padding:0 12px}
.pv-desk .chrome i{width:10px;height:10px;border-radius:50%;background:#D8CDB2}
.pv-desk .chrome span{margin:0 auto;font-size:12px;color:#736D5F;background:#FFFDF8;border-radius:8px;padding:3px 14px;direction:ltr}
.pv-desk .vp{position:relative;width:100%;aspect-ratio:16/10;overflow:hidden}
.pv-desk iframe{position:absolute;top:0;right:0;width:1280px;height:800px;border:0;transform-origin:top right}
.pv-phone{width:300px;height:620px;border-radius:44px;border:10px solid #2B2A24;overflow:hidden;position:relative;background:#F6F1E7;box-shadow:0 18px 40px rgba(43,42,36,.25);flex:none}
.pv-phone iframe{position:absolute;top:0;right:0;width:390px;height:836px;border:0;transform:scale(.718);transform-origin:top right}
.fpv{position:fixed;inset:0;z-index:70;background:#2B2A24;display:none;flex-direction:column}
.fpv.on{display:flex}
.fpv .bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:10px 14px;background:#1F1E1A;color:#F3ECDD}
.fpv .bar .tabs{background:#33312B}
.fpv .bar .tab{color:#C9C2B2}
.fpv .bar .tab.on{background:#4A473F;color:#fff;box-shadow:none}
.fpv .bar .btn{color:var(--text)}
.fpv .stagep{flex:1;display:flex;justify-content:center;overflow:auto}
.fpv iframe{border:0;background:#fff;height:100%;width:100%}
.fpv.m iframe{width:390px;max-width:100%}
.toast{position:fixed;bottom:22px;left:50%;transform:translate(-50%,12px);background:var(--text);color:#fff;padding:12px 18px;border-radius:12px;font-size:14px;opacity:0;transition:.22s;pointer-events:none;z-index:60;display:flex;gap:10px;align-items:center;max-width:92vw}
.toast.on{opacity:1;transform:translate(-50%,0)}

@media (max-width:860px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .side{position:sticky;top:64px;z-index:15;height:auto;flex-direction:row;overflow-x:auto;padding:8px 10px;border-inline-end:0;border-bottom:1px solid var(--line);gap:4px}
  .nav{width:auto;white-space:nowrap;min-height:40px}
  .nav svg{display:none}
  .sidefoot{display:none}
  main{padding:18px 14px 60px}
  .top{padding:0 12px;gap:8px}
  .brand small,.me .nm,.role>span{display:none}
  .ph h1{font-size:24px}
  .row2{grid-template-columns:1fr}
  .bar{grid-template-columns:90px minmax(0,1fr) 40px}
  .role select{max-width:150px;font-size:13px}
  .me{display:none}
  html,body{overflow-x:hidden}
  .kpis{grid-template-columns:1fr 1fr;gap:10px}
  .kpi{padding:14px}
  .kpi .v{font-size:28px}
  .li{flex-wrap:wrap}
  .li .tx{flex:1 1 200px}
  .li .btn.ok{margin-inline-start:48px}
}
</style>
</head>
<body>
<header class="top">
<div class="brand">
<svg width="34" height="34" viewBox="0 0 36 36" fill="none" stroke="#4F5D2F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 33V17"/><path d="M18 22l-6-5"/><path d="M18 19l6-5"/><circle cx="18" cy="9" r="4"/><circle cx="9" cy="14" r="3"/><circle cx="27" cy="11" r="3"/><path d="M11 33h14"/></svg>
شجرتنا <small>لوحة التحكم</small>
</div>
<button type="button" class="spill on" id="sitePill"><i></i><span>الموقع منشور</span></button>
<div class="role"><span>عرض اللوحة كـ</span>
<select id="roleSel" aria-label="تجربة اللوحة بصلاحية"></select>
</div>
<div class="me"><span class="av" id="meAv" style="background:#C9A75E">م</span><span class="nm" id="meNm" style="font-size:14px;font-weight:600"></span></div>
</header>

<div class="shell">
<nav class="side" id="side" aria-label="أقسام اللوحة"></nav>
<main id="main"></main>
</div>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="dTitle"></aside>
<div class="toast" id="toast" role="status"></div>

<script>
(function(){
/* ================= data (same family as the public site) ================= */
function rng(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const R=rng(1446);
const NAMES=['محمد','عبدالله','عبدالرحمن','إبراهيم','أحمد','علي','صالح','عبدالعزيز','سعد','فهد','خالد','حمد','ناصر','سلمان','يوسف','عمر','عثمان','حسن','حسين','عبدالمحسن','عبداللطيف','عبدالكريم','منصور','سليمان','بدر','فيصل','تركي','سعود','عادل','ماجد','نايف','راشد','مشاري','زياد','ريان','عبدالإله','وليد','هشام','طلال','مازن','أنس','حمزة','معاذ','يزيد','عبدالملك','نواف','بندر','عيسى','موسى','جاسم','مبارك','ياسر'];
const P=[],by={};
function anc(id){const r=[];let c=by[id];while(c){r.push(c.id);c=by[c.p];}return r;}
function add(n,p,b,extra){const x=Object.assign({id:P.length+1,n,p,b,kids:[],g:'m',vis:'family',by:'النظام',at:'استيراد أولي'},extra||{});P.push(x);by[x.id]=x;if(p)by[p].kids.push(x.id);return x;}
const founder=add('حمد',0,1842);
const q=[founder];
while(q.length&&P.length<720){const f=q.shift();const depth=anc(f.id).length-1;if(depth>=6)continue;
 let k=depth===0?6:depth===1?4+Math.floor(R()*3):Math.floor(R()*(depth<4?5.2:4));let year=f.b+23+Math.floor(R()*8);const gf=by[f.p];
 for(let i=0;i<k&&P.length<720;i++){if(year>2023)break;let n;if(i===0&&gf&&R()<.55&&gf.n!==f.n)n=gf.n;else{do{n=NAMES[Math.floor(R()*(R()<.6?14:NAMES.length))];}while(n===f.n||f.kids.some(c=>by[c].n===n));}
  const c=add(n,f.id,year);q.push(c);year+=2+Math.floor(R()*5);}}

/* ================= drawer: add / edit member ================= */
const drawer=document.getElementById('drawer'),scrim=document.getElementById('scrim');
let D=null;
function openDrawer(mode,opts={}){
 D={mode,g:'m',status:'alive',vis:'family',father:opts.father||null,edit:opts.id||null};
 if(mode==='edit'){const x=by[opts.id];D.g=x.g;D.status=x.d?'dead':'alive';D.vis=x.vis;}
 drawHTML(); drawer.classList.add('on'); scrim.classList.add('on');
 setTimeout(()=>{const f=drawer.querySelector('input');f&&f.focus();},250);

function closeDrawer(){drawer.classList.remove('on');scrim.classList.remove('on');D=null;}
function drawHTML(){
 const s=curSup(); const x=D.edit?by[D.edit]:null;
 if(D.mode==='sup'){drawSup();return;}
 const direct=!s||s.perms.direct;
 drawer.innerHTML=`<div class="dh"><div><h3 id="dTitle">${x?'تعديل بيانات '+esc(x.n):'إضافة فرد جديد'}</h3><div class="sub" style="margin-top:4px">${s?'ضمن فرع '+esc(by[s.scope].n):'أي مكان في الشجرة'}</div></div><button class="x" type="button" data-act="close" aria-label="إغلاق">${ic('x')}</button></div>
 <form class="db" id="mf" novalidate>
  ${x?`<div class="chosen">${avatar(x.id)}<span>${esc(fullName(x.id))}<small>الجيل ${gen(x.id)}</small></span></div>`:`

  <div class="row2">
   <div class="f"><label for="nm">الاسم الأول</label><input class="inp" id="nm" value="${x?esc(x.n):''}" placeholder="مثال: عبدالله"><span class="err" id="eN">اكتب الاسم</span></div>
   <div class="f"><span class="lb">الجنس</span><div class="segm" data-seg="g"><button type="button" class="${D.g==='m'?'on':''}" data-v="m">ذكر</button><button type="button" class="${D.g==='f'?'on':''}" data-v="f">أنثى</button></div></div>
  </div>
  <div class="row2">
   <div class="f"><label for="by">سنة الميلاد</label><input class="inp" id="by" inputmode="numeric" value="${x?x.b:''}" placeholder="مثال: 1995"><span class="err" id="eB">سنة غير منطقية</span></div>
   <div class="f"><span class="lb">الحالة</span><div class="segm" data-seg="status"><button type="button" class="${D.status==='alive'?'on':''}" data-v="alive">حي</button><button type="button" class="${D.status==='dead'?'on':''}" data-v="dead">متوفى</button></div></div>
  </div>
  ${D.status==='dead'?`<div class="f"><label for="dy">سنة الوفاة</label><input class="inp" id="dy" inputmode="numeric" value="${x&&x.d?x.d:''}" placeholder="مثال: 2020"></div>`:''}
  <div class="f"><label for="ph">رقم الجوال <span class="sub">(اختياري، لا يظهر في الشجرة)</span></label><input class="inp" id="ph" inputmode="tel" placeholder="05XXXXXXXX"></div>
  <div class="f"><span class="lb">من يرى هذا الفرد</span><div class="segm" data-seg="vis"><button type="button" class="${D.vis==='all'?'on':''}" data-v="all">الجميع</button><button type="button" class="${D.vis==='family'?'on':''}" data-v="family">الأقارب المسجّلون</button><button type="button" class="${D.vis==='admins'?'on':''}" data-v="admins">المشرفون فقط</button></div>${D.g==='f'?'<span class="h">إعداد الخصوصية العام يُخفي أسماء البنات عن الشجرة العامة.</span>':''}</div>
  <div class="f"><label for="nt">ملاحظة للمراجع <span class="sub">(اختياري)</span></label><textarea class="inp" id="nt" placeholder="مصدر المعلومة، أو أي توضيح"></textarea></div>
  <div class="preview" id="pv"></div>
  ${!direct&&!x?`<div class="note" style="background:var(--goldbg);color:#5E4716">${ic('info',18,'#8A6A26')}<span>بما أن صلاحية النشر المباشر غير مفعّلة لك، سيُرسل هذا الطلب للمدير العام للاعتماد ويظهر في الشجرة بعدها.</span></div>`:''}
 </form>
 <div class="df"><button class="btn p" type="button" data-act="save">${x?'حفظ التعديلات':direct?'إضافة للشجرة':'إرسال للاعتماد'}</button><button class="btn" type="button" data-act="close">إلغاء</button><span class="sub" style="margin-inline-start:auto">${x?'':'يُسجَّل باسمك في السجل'}</span></div>`;
 bindDrawer(); preview();
}
function preview(){const pv=document.getElementById('pv');if(!pv)return;const n=(document.getElementById('nm')||{}).value||'…';const f=D.edit?by[D.edit].p:D.father;
 pv.innerHTML=f?`سيظهر في الشجرة باسم:<br><b>${esc(n.trim()||'…')} ${D.g==='f'?'بنت':'بن'} ${esc(fullName(f).split(' بن ').slice(0,4).join(' بن '))}</b> · الجيل ${gen(f)+1}`:'اختر الأب لترى كيف سيظهر الاسم في الشجرة.';}
function bindDrawer(){
 drawer.querySelectorAll('[data-seg]').forEach(sg=>sg.onclick=e=>{const b=e.target.closest('button');if(!b)return;const k=sg.dataset.seg;const keep=collect();D[k]=b.dataset.v;drawHTML();restore(keep);});
 const nm=document.getElementById('nm');if(nm)nm.oninput=preview;
 const fq=document.getElementById('fq'),fo=document.getElementById('fo');
 if(fq){fq.oninput=()=>{const v=norm(fq.value);if(!v){fo.classList.remove('on');return;}
  const res=P.filter(x=>inScope(x.id)&&norm(fullName(x.id)).includes(v)).sort((a,b)=>gen(a.id)-gen(b.id)).slice(0,10);
  fo.innerHTML=res.length?res.map(x=>`<button type="button" class="opt" data-father="${x.id}">${avatar(x.id)}<span>${esc(x.n)}<small>${esc(fullName(x.id).split(' بن ').slice(1,5).join(' بن ')||'الجد المؤسس')} · ج${gen(x.id)}</small></span></button>`).join(''):'<div class="empty" style="padding:14px">لا يوجد اسم مطابق'+(curSup()?' في فرعك':'')+'</div>';fo.classList.add('on');};}
}
function collect(){const g=id=>{const e=document.getElementById(id);return e?e.value:undefined;};return {nm:g('nm'),by:g('by'),dy:g('dy'),ph:g('ph'),nt:g('nt')};}
function restore(v){Object.entries(v).forEach(([k,val])=>{const e=document.getElementById(k);if(e&&val!==undefined)e.value=val;});preview();}
function saveMember(){
 const v=collect(); const s=curSup(); let ok=true;
 const show=(id,on)=>{const e=document.getElementById(id);if(e)e.classList.toggle('on',on);if(on)ok=false;};
 const nm=(v.nm||'').trim(); show('eN',!nm);
 const yr=+v.by; const fth=D.edit?by[D.edit].p:D.father;
 if(!D.edit)show('eF',!fth);
 const minY=fth?by[fth].b+14:1800; show('eB',!(yr>=minY&&yr<=2026));
 if(!ok)return;
 if(D.edit){const x=by[D.edit];x.n=nm;x.b=yr;x.g=D.g;x.vis=D.vis;x.d=D.status==='dead'?(+v.dy||x.d||2025):undefined;
  LOG.unshift({who:s?supName(s):ME.name,act:'عدّل بيانات',what:short(x.id,2),when:'الآن',kind:'edit'});S.fresh=x.id;closeDrawer();render();toast('تم حفظ التعديلات');return;}
 const direct=!s||s.perms.direct;
 if(direct){const c=add(nm,fth,yr,{g:D.g,vis:D.vis,by:s?supName(s):ME.name,at:'الآن',addedAt:Date.now()});if(D.status==='dead')c.d=+v.dy||2025;
  addedThisMonth++;if(s)s.adds++;
  LOG.unshift({who:s?supName(s):ME.name,act:'أضاف',what:short(c.id,2),when:'الآن',kind:'add'});
  S.fresh=c.id;S.view='members';S.q='';closeDrawer();render();toast(`تمت إضافة ${nm} ${D.g==='f'?'بنت':'بن'} ${by[fth].n} للشجرة`);}
 else{REQS.unshift({id:rqSeq++,type:'add',name:nm,father:fth,b:yr,g:D.g,from:supName(s),via:'مشرف فرع',when:'الآن'});
  LOG.unshift({who:supName(s),act:'أرسل طلب إضافة',what:nm+' بن '+by[fth].n,when:'الآن',kind:'add'});
  S.view='requests';S.rqTab='all';closeDrawer();render();toast('أُرسل الطلب للمدير العام للاعتماد');}
}

 drawer.innerHTML=`<div class="dh"><div><h3 id="dTitle">تعيين مشرف فرع</h3><div class="sub" style="margin-top:4px">يدير المشرف فرعًا واحدًا فقط بالصلاحيات التي تحددها</div></div><button class="x" type="button" data-act="close" aria-label="إغلاق">${ic('x')}</button></div>
 <div class="db">
  <div class="f"><span class="lb">1. من هو المشرف؟</span>
   ${D.sp?`<div class="chosen">${avatar(D.sp,30)}<span>${esc(short(D.sp,3))}<small>سيصله رابط دعوة على جواله</small></span><button class="btn sm" type="button" data-act="clrSp">تغيير</button></div>`:`<div class="pick"><input class="inp" id="spq" type="search" autocomplete="off" placeholder="ابحث عن فرد من العائلة" aria-label="ابحث عن المشرف"><div class="opts" id="spo"></div></div>`}
   <span class="err" id="eS">اختر المشرف</span></div>

   ${D.sc?`<div class="chosen">${avatar(D.sc,30)}<span>فرع ${esc(short(D.sc,3))}<small>${scopeSize(D.sc)} فردًا تحت هذا الفرع</small></span><button class="btn sm" type="button" data-act="clrSc">تغيير</button></div>`:

    <div class="pick"><input class="inp" id="scq" type="search" autocomplete="off" placeholder="أو ابحث عن فرع أصغر، مثل: ناصر بن زياد" aria-label="ابحث عن فرع"><div class="opts" id="sco"></div></div>`}
   ${D.sp&&!D.sc?`<button class="lnk" style="margin:0;text-align:right" type="button" data-sc="${by[D.sp].p||D.sp}">اقتراح: فرع والده ${esc(short(by[D.sp].p||D.sp,2))}</button>`:''}
   <span class="err" id="eC">اختر الفرع</span></div>
  <div class="f"><span class="lb">3. الصلاحيات</span><div class="checks">

  </div></div>
 </div>
 <div class="df"><button class="btn p" type="button" data-act="saveSup">تعيين وإرسال الدعوة</button><button class="btn" type="button" data-act="close">إلغاء</button></div>`;
 if(!D.pp)D.pp={add:true,edit:true,del:false,direct:S.settings.supDirect};

/* ================= global events ================= */
function toast(t){const el=document.getElementById('toast');el.innerHTML=ic('check',18,'#C9D3B0')+'<span>'+esc(t)+'</span>';el.classList.add('on');clearTimeout(toast.h);toast.h=setTimeout(()=>el.classList.remove('on'),2600);}
scrim.onclick=closeDrawer;
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&D)closeDrawer();});
document.addEventListener('click',e=>{
 const t=e.target.closest('[data-view],[data-act],[data-edit],[data-addchild],[data-ok],[data-no],[data-rqtab],[data-perm],[data-set],[data-as],[data-rmsup],[data-father],[data-sp],[data-sc],[data-pp]');
 if(!t)return;
 const d=t.dataset;
 if(d.view){S.view=d.view;render();window.scrollTo({top:0});return;}
 if(d.father){const keep=collect();D.father=+d.father;drawHTML();restore(keep);return;}
 if(d.sp){D.sp=+d.sp;drawHTML();return;}
 if(d.sc){D.sc=+d.sc;drawHTML();return;}
 if(d.pp){D.pp[d.pp]=!D.pp[d.pp];t.setAttribute('aria-checked',D.pp[d.pp]);return;}
 if(d.edit){openDrawer('edit',{id:+d.edit});return;}
 if(d.addchild){openDrawer('add',{father:+d.addchild});return;}
 if(d.rqtab){S.rqTab=d.rqtab;render();return;}
 if(d.as){S.as=d.as;roleSel.value=d.as;roleSel.onchange();return;}
 if(d.rmsup){const i=SUPS.findIndex(s=>s.sid===+d.rmsup);const s=SUPS[i];SUPS.splice(i,1);LOG.unshift({who:ME.name,act:'ألغى إشراف',what:supName(s),when:'الآن',kind:'no'});render();toast('أُلغي الإشراف عن '+supName(s));return;}
 if(d.perm){const [sid,k]=d.perm.split(':');const s=SUPS.find(x=>x.sid===+sid);s.perms[k]=!s.perms[k];if(k==='add'&&!s.perms.add){s.perms.direct=false;}
  LOG.unshift({who:ME.name,act:(s.perms[k]?'منح':'سحب')+' صلاحية «'+({add:'الإضافة',edit:'التعديل',del:'الحذف',direct:'النشر المباشر'}[k])+'» من',what:supName(s),when:'الآن',kind:'perm'});render();return;}
 if(d.set){S.settings[d.set]=!S.settings[d.set];t.setAttribute('aria-checked',S.settings[d.set]);toast('تم حفظ الإعداد');return;}
 if(d.ok||d.no){const id=+(d.ok||d.no);const i=REQS.findIndex(r=>r.id===id);const r=REQS[i];REQS.splice(i,1);const who=curSup()?supName(curSup()):ME.name;
  if(d.ok){let msg='تم اعتماد الطلب';
   if(r.type==='add'){const c=add(r.name,r.father,r.b,{g:r.g,by:r.from,at:'اعتمده '+who,addedAt:Date.now()});addedThisMonth++;S.fresh=c.id;msg=`أُضيف ${r.name} للشجرة`;LOG.unshift({who,act:'اعتمد إضافة',what:short(c.id,2),when:'الآن',kind:'ok'});}
   else if(r.type==='edit'){by[r.target].b=+r.neu;LOG.unshift({who,act:'اعتمد تعديل',what:short(r.target,2),when:'الآن',kind:'ok'});}
   else{by[r.target].d=r.year;LOG.unshift({who,act:'اعتمد تسجيل وفاة',what:short(r.target,2),when:'الآن',kind:'ok'});}
   render();toast(msg);}
  else{LOG.unshift({who,act:'رفض طلبًا من',what:r.from,when:'الآن',kind:'no'});render();toast('تم رفض الطلب وإبلاغ صاحبه');}
  return;}
 const a=d.act;
 if(a==='add'){openDrawer('add');return;}
 if(a==='addSup'){D={mode:'sup'};drawSup();drawer.classList.add('on');scrim.classList.add('on');return;}
 if(a==='close'){closeDrawer();return;}
 if(a==='save'){saveMember();return;}
 if(a==='saveSup'){saveSup();return;}
 if(a==='clearFather'){const keep=collect();D.father=null;drawHTML();restore(keep);return;}
 if(a==='clrSp'){D.sp=null;drawSup();return;}
 if(a==='clrSc'){D.sc=null;drawSup();return;}
 if(a==='more'){S.limit+=25;render();return;}
 if(a==='saveFam'){toast('تم حفظ اسم العائلة');return;}
});


/* ================= site online / offline + preview ================= */
function modeMsg(viewer){return {type:'site-mode',online:S.site.online,msg:S.site.msg,back:S.site.back,viewer:viewer||S.pvViewer};}
function persistMode(){try{localStorage.setItem('shajaratna-site',JSON.stringify({online:S.site.online,msg:S.site.msg,back:S.site.back}));}catch(_){}}
function postTo(fr,viewer){try{fr&&fr.contentWindow&&fr.contentWindow.postMessage(modeMsg(viewer),'*');}catch(_){}}
function renderPill(){const p=document.getElementById('sitePill');const o=S.site.online;p.className='spill '+(o?'on':'off');p.querySelector('span').textContent=o?'الموقع منشور':'الموقع متوقف';p.title=o?'الموقع ظاهر للعائلة':'الزوار يشوفون صفحة الصيانة';}
document.getElementById('sitePill').onclick=()=>{if(S.as!=='admin'){toast(S.site.online?'الموقع منشور للعائلة':'الموقع متوقف حاليًا من المدير العام');return;}S.view='site';render();window.scrollTo({top:0});};
function vSite(){
 const o=S.site.online;
 const cap=!o&&S.pvViewer==='visitor'?'هذا ما يشوفه أي قريب يفتح الموقع الآن.':!o?'أنت تشوف الموقع كمدير رغم إيقافه، مع شريط تنبيه في الأعلى.':'هذا الموقع كما يظهر للعائلة الآن. جرّب تتصفح داخل المعاينة.';
 return `<div class="ph"><div><h1>الموقع والنشر</h1><p>تحكم في ظهور الموقع للعائلة، وعاينه قبل وبعد أي تغيير</p></div>
  <div class="sp"><button class="btn" type="button" data-act="fullPv">${ic('eye')}معاينة بملء الشاشة</button></div></div>
 <section class="card hero-st">
  <span class="ic big" style="background:${o?'#E7EBDA':'#F6E1DA'}">${ic(o?'globe':'power',26,o?'#3E4A24':'#A3412C')}</span>
  <div style="flex:1 1 260px"><div style="display:flex;flex-wrap:wrap;align-items:center;gap:10px"><b style="font-size:20px">${o?'الموقع منشور':'الموقع متوقف مؤقتًا'}</b><span class="badge ${o?'b-ok':'b-red'}">${o?'أونلاين':'أوفلاين'}</span></div>
  <div class="sub" style="margin-top:6px;line-height:1.7">${o?'الأقارب المسجّلون يقدرون يتصفحون الشجرة الآن.':'الزوار يشوفون صفحة الصيانة. '+(S.site.allowSups?'المشرفون والمدير يدخلون عادي.':'المدير العام فقط يقدر يدخل.')} آخر تغيير: ${esc(S.site.changed)}</div></div>
  <button class="btn ${o?'no':'p'}" type="button" data-act="${o?'goOff':'goOn'}">${ic('power',17)}${o?'إيقاف الموقع مؤقتًا':'إعادة نشر الموقع'}</button>
 </section>
 <section class="card" style="margin-top:18px">
  <div class="pvbar"><h2 style="margin-inline-end:auto">المعاينة</h2>
   <div class="tabs" role="tablist" aria-label="المعاينة كـ"><button type="button" class="tab ${S.pvViewer==='visitor'?'on':''}" data-pvv="visitor">كما يراه الزائر</button><button type="button" class="tab ${S.pvViewer==='admin'?'on':''}" data-pvv="admin">كما يراه المدير</button></div>
   <div class="tabs" role="tablist" aria-label="الجهاز"><button type="button" class="tab ${S.pvDev==='d'?'on':''}" data-pvd="d">كمبيوتر</button><button type="button" class="tab ${S.pvDev==='m'?'on':''}" data-pvd="m">جوال</button></div>
  </div>
  <div class="pv-wrap">${S.pvDev==='m'?`<div class="pv-phone"><iframe id="pvf" src="index.html" title="معاينة الموقع على الجوال"></iframe></div>`:`<div class="pv-desk"><div class="chrome"><i></i><i></i><i></i><span>family-tree.sa</span></div><div class="vp" id="pvVp"><iframe id="pvf" src="index.html" title="معاينة الموقع على الكمبيوتر"></iframe></div></div>`}</div>
  <div class="sub" style="padding:12px 18px">${cap}</div>
 </section>
 <section class="card" style="margin-top:18px;max-width:820px">
  <div class="ch"><h2>رسالة صفحة الصيانة</h2><span class="sub" style="margin-inline-start:auto">تتحدّث في المعاينة مباشرة</span></div>
  <div class="db" style="padding:18px">
   <div class="f"><label for="smsg">النص الذي يظهر للزوار</label><textarea class="inp" id="smsg">${esc(S.site.msg)}</textarea></div>
   <div class="f"><label for="sback">موعد العودة المتوقع <span class="sub">(اختياري)</span></label><input class="inp" id="sback" value="${esc(S.site.back)}" placeholder="مثال: يوم الخميس مساءً"></div>
   <div class="perm"><span>السماح للمشرفين بالدخول أثناء الإيقاف<small>يكملون إضافة أفراد فروعهم والموقع مقفل على الباقين</small></span><button type="button" class="sw" role="switch" aria-checked="${S.site.allowSups}" aria-label="السماح للمشرفين بالدخول" data-act="allowSups"></button></div>
  </div>
 </section>`;
}
function fitDesk(){const vp=document.getElementById('pvVp');if(!vp)return;const f=vp.querySelector('iframe');const k=vp.clientWidth/1280;f.style.transform=`scale(${k})`;f.style.height=(vp.clientHeight/k)+'px';}
function setupPreview(){
 const f=document.getElementById('pvf');if(!f)return;
 f.addEventListener('load',()=>{postTo(f);setTimeout(()=>postTo(f),400);});
 fitDesk();
 const m=document.getElementById('smsg'),b=document.getElementById('sback');
 const live=()=>{S.site.msg=m.value;S.site.back=b.value;persistMode();postTo(document.getElementById('pvf'));};
 if(m)m.oninput=live; if(b)b.oninput=live;
}
window.addEventListener('resize',fitDesk);
function goOffDrawer(){
 D={mode:'off'};
 drawer.innerHTML=`<div class="dh"><div><h3 id="dTitle">إيقاف الموقع مؤقتًا</h3><div class="sub" style="margin-top:4px">بيانات العائلة ما تتأثر، فقط يختفي الموقع عن الزوار</div></div><button class="x" type="button" data-act="close" aria-label="إغلاق">${ic('x')}</button></div>
 <div class="db">
  <div class="f"><label for="omsg">الرسالة التي تظهر للزوار</label><textarea class="inp" id="omsg">${esc(S.site.msg)}</textarea></div>
  <div class="f"><label for="oback">موعد العودة المتوقع <span class="sub">(اختياري)</span></label><input class="inp" id="oback" value="${esc(S.site.back)}" placeholder="مثال: بعد صلاة الجمعة"></div>
  <div class="perm"><span>السماح للمشرفين بالدخول أثناء الإيقاف<small>المدير العام يدخل دائمًا</small></span><button type="button" class="sw" role="switch" aria-checked="${S.site.allowSups}" aria-label="السماح للمشرفين بالدخول" id="oSup"></button></div>
  <div class="note" style="background:var(--redbg);color:#7A2E1E">${ic('info',18,'#A3412C')}<span>بمجرد الإيقاف، أي أحد يفتح الموقع يشوف صفحة الصيانة بدل الشجرة. تقدر ترجعه بضغطة من نفس المكان.</span></div>
 </div>
 <div class="df"><button class="btn p" type="button" data-act="confirmOff" style="background:#A3412C;border-color:#A3412C">${ic('power',17)}إيقاف الآن</button><button class="btn" type="button" data-act="close">إلغاء</button></div>`;
 document.getElementById('oSup').onclick=e=>{S.site.allowSups=!S.site.allowSups;e.currentTarget.setAttribute('aria-checked',S.site.allowSups);};
 drawer.classList.add('on');scrim.classList.add('on');
}
const fpv=document.createElement('div');fpv.className='fpv';fpv.setAttribute('role','dialog');fpv.setAttribute('aria-label','معاينة الموقع بملء الشاشة');document.body.appendChild(fpv);
function openFull(){
 fpv.className='fpv on'+(S.pvDev==='m'?' m':'');
 fpv.innerHTML=`<div class="bar"><b style="margin-inline-end:auto">معاينة الموقع · ${S.site.online?'منشور':'متوقف'}</b>
  <div class="tabs"><button type="button" class="tab ${S.pvViewer==='visitor'?'on':''}" data-fv="visitor">زائر</button><button type="button" class="tab ${S.pvViewer==='admin'?'on':''}" data-fv="admin">مدير</button></div>
  <div class="tabs"><button type="button" class="tab ${S.pvDev==='d'?'on':''}" data-fd="d">كمبيوتر</button><button type="button" class="tab ${S.pvDev==='m'?'on':''}" data-fd="m">جوال</button></div>
  <button class="btn sm" type="button" data-act="closeFull">إغلاق المعاينة</button></div>
  <div class="stagep"><iframe id="fpf" src="index.html" title="معاينة الموقع"></iframe></div>`;
 const f=document.getElementById('fpf');f.addEventListener('load',()=>{postTo(f);setTimeout(()=>postTo(f),400);});
}
fpv.addEventListener('click',e=>{const t=e.target.closest('[data-fv],[data-fd],[data-act="closeFull"]');if(!t)return;
 if(t.dataset.fv){S.pvViewer=t.dataset.fv;openFull();return;}
 if(t.dataset.fd){S.pvDev=t.dataset.fd;openFull();return;}
 fpv.className='fpv';fpv.innerHTML='';if(S.view==='site')render();});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&fpv.classList.contains('on')){fpv.className='fpv';fpv.innerHTML='';}});
document.addEventListener('click',e=>{
 const t=e.target.closest('[data-pvv],[data-pvd],[data-act="goOff"],[data-act="goOn"],[data-act="confirmOff"],[data-act="fullPv"],[data-act="allowSups"]');if(!t)return;
 const d=t.dataset;
 if(d.pvv){S.pvViewer=d.pvv;render();return;}
 if(d.pvd){S.pvDev=d.pvd;render();return;}
 if(d.act==='goOff'){goOffDrawer();return;}
 if(d.act==='confirmOff'){S.site.msg=document.getElementById('omsg').value;S.site.back=document.getElementById('oback').value;S.site.online=false;S.site.changed='الآن';S.pvViewer='visitor';persistMode();
  LOG.unshift({who:ME.name,act:'أوقف الموقع مؤقتًا',what:'لجميع الزوار',when:'الآن',kind:'no'});closeDrawer();S.view='site';render();toast('تم إيقاف الموقع. الزوار يشوفون صفحة الصيانة الآن');return;}
 if(d.act==='goOn'){S.site.online=true;S.site.changed='الآن';persistMode();LOG.unshift({who:ME.name,act:'أعاد نشر الموقع',what:'للعائلة',when:'الآن',kind:'ok'});render();toast('الموقع منشور من جديد');return;}
 if(d.act==='fullPv'){openFull();return;}
 if(d.act==='allowSups'){S.site.allowSups=!S.site.allowSups;t.setAttribute('aria-checked',S.site.allowSups);toast('تم حفظ الإعداد');return;}
});
document.getElementById('meNm').textContent='محمد · المدير العام';
render();
})();
</script>
</body>
